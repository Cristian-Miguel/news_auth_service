spring.application.name=auth-service
server.port=

### JWT config ###
jwt.secret-key=
jwt.expired-date=
jwt.expired-date-refresh=

### Encript  config ###
crypto.secret-key=

### database ###
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://127.0.0.1:0000/exampledb
spring.datasource.username=
spring.datasource.password=

### Hibernate settings ###
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

### Logging settings ###
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

### Kafka configuration ###
# Kafka server configuration
spring.kafka.bootstrap-servers=localhost:
spring.kafka.properties.security.protocol=

# Kafka configuration for Spring Boot microservice (producer/consumer)
# Producer configuration
spring.kafka.producer.bootstrap-servers=localhost:
spring.kafka.producer.key-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer configuration
#org.springframework.kafka.support.serializer.JsonDeserializer
#org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.bootstrap-servers=localhost:
spring.kafka.consumer.group-id=
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.auto-offset-reset=

# Kafka configuration for SSL connection
spring.kafka.ssl.key-store-type=
spring.kafka.ssl.trust-store-type=
spring.kafka.properties.ssl.protocol=
spring.kafka.properties.ssl.enabled.protocols=
spring.kafka.properties.ssl.truststore.location=E:\\path\\to\\ssl\\truststore\\key
spring.kafka.properties.ssl.truststore.password=

spring.kafka.properties.ssl.keystore.location=E:\\path\\to\\ssl\\keystore\\key
spring.kafka.properties.ssl.keystore.password=
spring.kafka.properties.ssl.key.password=